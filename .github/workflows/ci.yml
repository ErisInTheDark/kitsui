name: CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/setup@v3
        with:
          cache: true

      - name: Run tests
        run: pnpm run test:run

      - name: Run typecheck
        run: pnpm run typecheck

  docs:
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/setup@v3
        with:
          cache: true

      - name: Build docs
        run: pnpm run build:docs

      - name: Deploy pages branch
        uses: s0/git-publish-subdir-action@v2.5.1
        env:
          REPO: self
          BRANCH: pages
          FOLDER: docs
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MESSAGE: "Docs {sha}:\n{msg}"
