name: publish npm package
run-name: ${{ github.event_name == 'workflow_dispatch' && 'prepare @inthedark/kitsui release' || format('publish @inthedark/kitsui@{0}', github.event.client_payload.version) }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: exact version override; blank increments the committed patch
        required: false
        default: ""
        type: string
  repository_dispatch:
    types: [publish-npm-package]

concurrency:
  group: publish-npm-package
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: require main
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@v6
      - uses: pnpm/setup@v3
        with:
          cache: true
      - name: test
        run: pnpm run test:run
      - name: typecheck
        run: pnpm run typecheck
      - name: prepare version
        id: release
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          args=(--prepare-version)
          if [[ -n "$REQUESTED_VERSION" ]]; then
            args+=(--version "$REQUESTED_VERSION")
          fi
          version="$(pnpm exec tsx scripts/publish-package.ts "${args[@]}")"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: commit version
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if git diff --quiet -- package.json; then
            echo "package.json already contains $VERSION; preparing a publish retry."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- package.json
            git commit -m "release @inthedark/kitsui $VERSION"
            git push origin HEAD:main
          fi
      - name: dispatch committed publication
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          commit="$(git rev-parse HEAD)"
          gh api --method POST "repos/$GITHUB_REPOSITORY/dispatches" \
            -f event_type=publish-npm-package \
            -f "client_payload[version]=$VERSION" \
            -f "client_payload[commit]=$commit"

  publish:
    if: github.event_name == 'repository_dispatch'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: require prepared main commit
        env:
          EXPECTED_COMMIT: ${{ github.event.client_payload.commit }}
        run: test "$GITHUB_REF" = refs/heads/main && test "$GITHUB_SHA" = "$EXPECTED_COMMIT"
      - uses: actions/checkout@v6
      - uses: pnpm/setup@v3
        with:
          cache: true
      - name: publish
        env:
          EXPECTED_VERSION: ${{ github.event.client_payload.version }}
        run: pnpm exec tsx scripts/publish-package.ts --publish --version "$EXPECTED_VERSION"

  docs:
    needs: publish
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/setup@v3
        with:
          cache: true
      - name: build docs
        run: pnpm run build:docs
      - name: deploy pages branch
        working-directory: docs
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.event.client_payload.version }}
        run: |
          git init -q -b pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "docs @inthedark/kitsui $VERSION ($GITHUB_SHA)"
          git push --force "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" pages
